<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REDX | Login</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 15% 20%, #541010 0%, transparent 35%),
      radial-gradient(circle at 85% 80%, #360909 0%, transparent 35%),
      #090909;
    color: white;
    padding: 20px;
    overflow-x: hidden;
}

/* Background decoration */
.glow {
    position: fixed;
    width: 350px;
    height: 350px;
    background: #e50920;
    filter: blur(180px);
    opacity: .15;
    border-radius: 50%;
    pointer-events: none;
}

.glow.one {
    top: -100px;
    left: -100px;
}

.glow.two {
    bottom: -100px;
    right: -100px;
}

/* Login container */
.container {
    width: 100%;
    max-width: 430px;
    position: relative;
    z-index: 2;
    padding: 42px 35px;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 22px;
    background: rgba(20, 16, 17, .88);
    backdrop-filter: blur(20px);
    box-shadow:
      0 20px 70px rgba(0,0,0,.6),
      0 0 35px rgba(220,0,25,.08);
    animation: appear .8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Logo */
.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo-icon {
    width: 65px;
    height: 65px;
    margin: auto;
    border-radius: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    font-weight: 800;
    color: white;
    background: linear-gradient(135deg, #ff263e, #79000d);
    box-shadow: 0 0 30px rgba(255,0,30,.3);
}

.logo h1 {
    margin-top: 15px;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 3px;
}

.logo h1 span {
    color: #ff263e;
}

.logo p {
    margin-top: 8px;
    font-size: 12px;
    color: #929292;
}

/* Heading */
.heading {
    margin-bottom: 25px;
}

.heading h2 {
    font-size: 23px;
    margin-bottom: 8px;
}

.heading p {
    color: #999;
    font-size: 13px;
}

/* Input */
.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    font-size: 12px;
    color: #ddd;
    margin-bottom: 9px;
}

.input-box {
    position: relative;
}

.input-box input {
    width: 100%;
    padding: 15px 45px 15px 15px;
    background: #171415;
    border: 1px solid #393032;
    border-radius: 10px;
    outline: none;
    color: white;
    font-size: 13px;
    transition: .3s;
}

.input-box input:focus {
    border-color: #ff263e;
    box-shadow: 0 0 12px rgba(255,38,62,.13);
}

.input-box input::placeholder {
    color: #686164;
}

.input-icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #999;
    cursor: pointer;
    font-size: 15px;
}

/* Remember */
.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    margin: 5px 0 22px;
    color: #aaa;
}

.options a {
    color: #ff475b;
    text-decoration: none;
}

.remember {
    display: flex;
    gap: 7px;
    align-items: center;
}

/* Login button */
.login-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    background: linear-gradient(110deg, #ff263e, #a90018);
    box-shadow: 0 5px 20px rgba(255,0,30,.2);
    transition: .3s;
}

.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 28px rgba(255,0,30,.4);
}

/* Divider */
.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 23px 0;
    color: #777;
    font-size: 11px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #393032;
}

/* Google */
.google-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #393032;
    background: #171415;
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: .3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

.google-btn:hover {
    background: #292021;
    border-color: #ff263e;
}

.google-icon {
    background: white;
    color: #4285F4;
    font-weight: 800;
    font-size: 17px;
    border-radius: 50%;
    width: 23px;
    height: 23px;
    display: grid;
    place-items: center;
}

/* Footer */
.footer {
    text-align: center;
    font-size: 11px;
    color: #888;
    margin-top: 25px;
}

.footer a {
    color: #ff475b;
    text-decoration: none;
    font-weight: 600;
}

.copyright {
    text-align: center;
    margin-top: 25px;
    font-size: 10px;
    color: #555;
}

@media(max-width:480px) {
    .container {
        padding: 35px 23px;
    }

    .logo h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="container">

    <div class="logo">
        <div class="logo-icon">R</div>
        <h1>RED<span>X</span></h1>
        <p>WELCOME TO THE NEXT GENERATION</p>
    </div>

    <div class="heading">
        <h2>Welcome Back!</h2>
        <p>Masuk ke akun Anda untuk melanjutkan.</p>
    </div>

    <form id="loginForm">

        <div class="input-group">
            <label>Username</label>
            <div class="input-box">
                <input type="text"
                id="username"
                placeholder="Masukkan username"
                required>
                <span class="input-icon">♙</span>
            </div>
        </div>

        <div class="input-group">
            <label>Gmail Address</label>
            <div class="input-box">
                <input type="email"
                id="email"
                placeholder="example@gmail.com"
                required>
                <span class="input-icon">✉</span>
            </div>
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="input-box">
                <input type="password"
                id="password"
                placeholder="Masukkan password"
                required>
                <span class="input-icon"
                onclick="togglePassword()"
                id="eye">◉</span>
            </div>
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox">
                Remember me
            </label>
            <a href="#" onclick="alert('Hubungkan fitur reset password dengan backend.')">
                Forgot password?
            </a>
        </div>

        <button type="submit" class="login-btn">
            SIGN IN →
        </button>

    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <button class="google-btn" onclick="googleLogin()">
        <span class="google-icon">G</span>
        Login with Google
    </button>

    <div class="footer">
        Belum punya akun?
        <a href="#" onclick="alert('Halaman register belum dibuat.')">
            Create Account
        </a>
    </div>

    <div class="copyright">
        © 2026 REDX. ALL RIGHTS RESERVED.
    </div>

</div>

<script>

// Show / Hide Password
function togglePassword() {
    const pass = document.getElementById("password");
    const eye = document.getElementById("eye");

    if(pass.type === "password") {
        pass.type = "text";
        eye.textContent = "◎";
    } else {
        pass.type = "password";
        eye.textContent = "◉";
    }
}

// Login validation demo

async function redxApi(url, options = {}) {
    const csrfResponse = await fetch("/api/auth/csrf", {
        credentials: "same-origin"
    });

    const csrfToken = await csrfResponse.text();

    return fetch(url, {
        ...options,
        credentials: "same-origin",
        headers: {
            ...(options.headers || {}),
            "X-XSRF-TOKEN": csrfToken
        }
    });
}

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
        alert("Username dan password wajib diisi!");
        return;
    }

    try {
        const response = await redxApi("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        if (!response.ok) {
            alert("Login gagal. Periksa username dan password.");
            return;
        }

        const result = await response.json();

        if (result.role === "ADMIN") {
            window.location.href = "/admin.html";
        } else {
            window.location.href = "/home.html";
        }

    } catch (error) {
        alert("Server REDX belum terhubung.");
        console.error(error);
    }
});

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if(!username || !email || !password) {
        alert("Mohon lengkapi semua data!");
        return;
    }

    alert("Tampilan login berhasil diuji! Hubungkan backend untuk autentikasi akun.");

;

// Google login
function googleLogin() {
    alert("Login Google belum diaktifkan. Silakan konfigurasi Google OAuth terlebih dahulu.");
}

</script>

</body>
</html>
